<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureTasks · Experience preview</title><style>
html,body{height:100%;margin:0;font:13px system-ui;background:#edf0ef}body{display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 20px;background:#193c36;color:#fff}header span{flex:1}button{background:none;color:inherit;border:1px solid #7c9c94;border-radius:6px;padding:6px 10px;cursor:pointer}iframe{border:0;flex:1;min-height:0;width:100%;align-self:center;background:#f7f8f8}iframe.narrow{width:390px;max-width:100%}
</style></head><body><header><b>PureTasks / Experience preview</b><span>Fictional boards · saved in this browser session · no external writes</span><button id="size">Narrow window</button><button id="reset">Reset examples</button></header><iframe title="PureTasks" src="./preview-frame.html"></iframe><script>
const frame=document.querySelector('iframe');document.querySelector('#size').onclick=()=>{frame.classList.toggle('narrow');document.querySelector('#size').textContent=frame.classList.contains('narrow')?'Desktop width':'Narrow window'};document.querySelector('#reset').onclick=()=>{sessionStorage.removeItem('puretasks-experience-preview');frame.src='./preview-frame.html'};
</script></body></html>
